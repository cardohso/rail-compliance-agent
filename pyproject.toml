[project]
name = "rail-compliance-agent"
version = "0.1.0"
description = "A tool-using agent that checks a train design spec against the EU PRM TSI, evaluated on its tool use."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Cardoso" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rail-compliance = "rail_compliance.cli:main"
rail-compliance-mcp = "rail_compliance.mcp_server:main"
rail-compliance-eval = "rail_compliance.evaluation.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
eval = [
    "goldpass",
]
local = [
    "rail-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rail_compliance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"eval/build_golden.py" = ["E501"]  # data file: long rationale strings read better unwrapped
"eval/build_heldout.py" = ["E501"]  # data file, same reason
"eval/build_heldout2.py" = ["E501"]  # data file, same reason

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
rail-rag = { git = "https://github.com/cardohso/rail-regulation-rag", rev = "d63cc5f37fcc93100b7bc25a61a63d4507d24248" }
goldpass = { git = "https://github.com/cardohso/goldpass", rev = "v0.2.0" }
